<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Steven Atilho">
  <meta name="keywords" content="{{ page.tags | join: ', ' }}">

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ site.title }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title }} | {{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">

  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Load fonts asynchronously -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- Background glow effects -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">Atilho</a>
      <ul class="nav-menu">
        <li><a href="/#about"><span class="nav-number">0.</span>ABOUT</a></li>
        <li><a href="/#projects"><span class="nav-number">1.</span>PROJECTS</a></li>
        <li><a href="/#writeups"><span class="nav-number">2.</span>WRITEUPS</a></li>
        <li><a href="/#photography"><span class="nav-number">3.</span>PHOTOS</a></li>
        <li><a href="/#contact"><span class="nav-number">4.</span>CONTACT</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <main class="post-content">
    <article class="container">
      <header class="post-header">
        <a href="/#writeups" class="back-link">&larr; Back to writeups</a>
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
          {% if page.tags %}
          <div class="post-tags">
            {% for tag in page.tags %}
            <span class="post-tag">{{ tag }}</span>
            {% endfor %}
          </div>
          {% endif %}
        </div>
      </header>

      <div class="post-body">
        {{ content }}
      </div>
    </article>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} Steven Morais Atilho</p>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-menu');

    navToggle.addEventListener('click', () => {
      navMenu.classList.toggle('active');
      navToggle.classList.toggle('active');
    });

    document.querySelectorAll('.nav-menu a').forEach(link => {
      link.addEventListener('click', () => {
        navMenu.classList.remove('active');
        navToggle.classList.remove('active');
      });
    });
  </script>
</body>
</html>
