# Site settings
title: Steven Morais Atilho
email: steven@atilho.com
description: >-
  Builder of things. Security by trade. Curious by nature.
baseurl: ""
url: "https://www.stevenatilho.com"

# Build settings
markdown: kramdown
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - CLAUDE.md

# Collections (for future scalability)
collections:
  writeups:
    output: true
    permalink: /writeups/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "writeups"
    values:
      layout: "post"
